name: Build Internal (.so)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Configure (CMake + NDK, arm64-v8a)
        run: |
          cmake -S Internal -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Package (lib + injector)
        run: |
          mkdir -p dist
          cp build/libStandoffMenu.so dist/
          cp Internal/injector/andkittyinjector dist/
          cp Internal/injector/inject.sh dist/
          chmod +x dist/andkittyinjector dist/inject.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: StandoffMenu-inject
          path: dist/
          if-no-files-found: error
